<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSIR NET Mathematics Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>CSIR NET Mathematics Quiz</h1>

    <div id="loginPage">

        <input
            type="text"
            id="username"
            placeholder="Enter Your Name">

        <button onclick="login()">
            Start Quiz
        </button>

    </div>

    <div id="quizPage" hidden>

        <div class="topbar">

            <span id="user"></span>

            <span id="timer"></span>

            <button onclick="toggleDark()">
                Dark Mode
            </button>

        </div>
<div class="progress">
    <div
    class="progress-bar"
    id="progressBar">
    </div>
</div>
        <h2 id="question"></h2>

        <div id="options"></div>

        <button onclick="nextQuestion()">
            Next Question
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
