<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSIR-NET Mock Test Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:420px;
    background:#ffffff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    text-align:center;
}

.logo{
    font-size:55px;
    margin-bottom:10px;
}

.title{
    font-size:28px;
    font-weight:700;
    color:#1e293b;
    margin-bottom:8px;
}

.subtitle{
    color:#64748b;
    font-size:14px;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

.creator{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #e2e8f0;
    color:#334155;
    font-size:14px;
}

.creator strong{
    color:#0f172a;
}

.tagline{
    margin-top:8px;
    font-size:12px;
    color:#64748b;
}

</style>

</head>

<body>

<div class="login-card">

```
<div class="logo">🎓</div>

<div class="title">
    CSIR-NET Mock Test Portal
</div>

<div class="subtitle">
    Mathematical Sciences Practice Platform
</div>

<input
    id="username"
    placeholder="Enter User ID">

<input
    id="password"
    type="password"
    placeholder="Enter Password">

<button onclick="login()">
    Sign In
</button>

<div class="creator">
    Developed & Maintained By<br>
    <strong>Indranil Ghosh</strong>

    <div class="tagline">
        CSIR-NET Mathematical Sciences Preparation Portal
    </div>
</div>
```

</div>

<script>

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (
        username === "indranil" &&
        password === "csirnet"
    ) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        window.location.href =
            "home.html";

    }
    else {

        alert(
            "Invalid User ID or Password"
        );

    }

}

</script>

</body>
</html>
